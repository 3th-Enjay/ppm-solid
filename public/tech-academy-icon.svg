<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40" fill="none">
  <defs>
    <linearGradient id="tech-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="tech-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#60A5FA" />
    </linearGradient>
    <filter id="subtle-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-opacity="0.25" />
    </filter>
  </defs>
  <!-- Background Squircle -->
  <rect width="40" height="40" rx="10" fill="url(#tech-bg)" />
  <rect x="0.5" y="0.5" width="39" height="39" rx="9.5" stroke="rgba(255,255,255,0.2)" stroke-width="1" />

  <!-- Subtle Architecture Grid Lines -->
  <path d="M7 20H33M20 7V33" stroke="rgba(255,255,255,0.07)" stroke-width="1" />

  <!-- Terminal Chevron: > -->
  <path d="M12 13.5L19.5 20L12 26.5" stroke="#FFFFFF" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round" filter="url(#subtle-shadow)" />

  <!-- Terminal Cursor: _ -->
  <line x1="21.5" y1="26.5" x2="28.5" y2="26.5" stroke="url(#tech-accent)" stroke-width="2.75" stroke-linecap="round" />

  <!-- Compiler / Node Accent Dot -->
  <circle cx="27" cy="14" r="2.25" fill="#38BDF8" />
</svg>
